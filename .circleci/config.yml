# In order for builds to pass, in CircleCI you must add all required environment variables, described in `testing_keys.json.example`

version: 2.1

workflows:
  php-tests:
    jobs:
      # The only job that needs no Postmark credentials, so it is the only one that
      # gives a fork PR any signal at all. Everything below is an integration suite
      # against the live API and cannot start without the tokens above.
      - static-analysis:
          name: static-guzzle8
          guzzle: "^8.0.1"
      # The constraint allows two Guzzle majors, so both have to be exercised or
      # the compat claim is just an assertion. Guzzle 8 reclassified transport
      # exceptions, which is the surface this SDK re-exports.
      - static-analysis:
          name: static-guzzle7
          guzzle: "^7.15.2"
      - unit-tests:
          name: php82
          version: "8.2"
      - unit-tests:
          name: php83
          version: "8.3"
      - unit-tests:
          name: php84
          version: "8.4"
      - unit-tests:
          name: php85
          version: "8.5"

jobs:
  static-analysis:
    parameters:
      guzzle:
        description: "Guzzle constraint to resolve against"
        type: string
        default: "^8.0.1"
    docker:
      - image: cimg/php:8.2
    steps:
      - checkout
      - run:
          name: Install dependencies (Guzzle << parameters.guzzle >>)
          command: |
            composer require --no-update --no-interaction "guzzlehttp/guzzle:<< parameters.guzzle >>"
            composer update --no-interaction --with-all-dependencies
            composer show guzzlehttp/guzzle | grep '^versions'
      - run:
          name: PHPStan
          command: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      # php-cs-fixer is deliberately NOT a gate yet: its config was missing
      # setFinder(), so the fixer has never run here and 8 files are already
      # non-conforming on main. A check that ships red just teaches people to
      # ignore it. Run it for visibility, promote it to a gate after a
      # formatting pass.
      - run:
          name: php-cs-fixer (advisory)
          command: vendor/bin/php-cs-fixer fix --dry-run --diff || true

  unit-tests:
    parameters:
      version:
        description: "PHP version tag"
        type: string

    docker:
      - image: cimg/php:<< parameters.version >>

    steps:
      - checkout
      - run:
          name: Version
          command: |
            echo "PHP: $(php --version)"
      - run:
          name: Install dependencies
          command: |
            sudo composer self-update
            sudo composer install --no-interaction
      - run:
          name: Run tests
          command: composer test
